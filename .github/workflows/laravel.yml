name: Laravel CI/CD (Testing Foundation)

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
        coverage: none

    - uses: actions/checkout@v3

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate key
      run: php artisan key:generate

    - name: Setup Database (SQLite)
      run: |
        touch database/database.sqlite
        sed -i -e 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
        sed -i -e 's/DB_DATABASE=.*/DB_DATABASE=database\/database.sqlite/' .env

    - name: Run Migrations
      run: php artisan migrate --force

    - name: Run Automated Feature Tests (PHPUnit)
      run: php artisan test --parallel
